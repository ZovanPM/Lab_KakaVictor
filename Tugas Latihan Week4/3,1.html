<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Soal 3.1 Latihan JavaScript</title>
    </head>

    <body>
        <h1>Program FizzBuzz</h1>

        <script>
        for (let i = 1; i <= 20; i++) {
            if (i % 3 === 0 && i % 5 === 0){
                console.log("FizzBuzz");
            } else if (i % 3 === 0) {
                console.log("Fizz");
            } else if (i % 5 === 0) {
                console.log("Buzz");
            } else {
                console.log(i);            }
        }
        </script>
    </body>

</html>
