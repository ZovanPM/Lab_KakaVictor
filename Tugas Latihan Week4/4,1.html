<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Soal 4.1 Latihan JavaScript</title>
    </head>
    <body>
        <h1>Hitung Luas</h1>
        
        <script>
            function hitungLuasPersegiPanjang(panjang, lebar) {
                return panjang * lebar;
            }

            console.log(`Luas = ${hitungLuasPersegiPanjang(5, 4)}`);
            console.log(`Luas = ${hitungLuasPersegiPanjang(10, 3)}`);
            console.log(`Luas = ${hitungLuasPersegiPanjang(7, 6)}`);
        </script>
    </body>
</html>
