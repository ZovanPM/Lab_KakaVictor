<button id="tombol">Tambah</button>

<p id="angka">0</p>

<script>
    const tombol = document.getElementById("tombol");
    const angka = document.getElementById("angka");

    tombol.onclick = function() {
        let currentValue = parseInt(angka.innerHTML);
        angka.innerHTML = currentValue + 1;
    };
</script>
