<input type="text" id="inputTeks">

<p id="jumlah">Jumlah Karakter: 0</p>

<script>
    const inputTeks = document.getElementById("inputTeks");
    const jumlah = document.getElementById("jumlah");

    inputTeks.addEventListener("input", function() {
        const panjangTeks = inputTeks.value.length;
        jumlah.innerHTML = "Jumlah Karakter: " + panjangTeks;
    });
</script>
